name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

# A pull request's newer push replaces its older run. On main and next every commit runs
# to the end: a docs-only push skips the end-to-end tests, so cancelling the commit
# before it would leave that code untested.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on Ubuntu 24.04 rather than ubuntu-latest, which is moving to 26.04. The
# image already has what Chromium needs, so the browser installs without
# `--with-deps`, whose packages could take a quarter of an hour to download.
jobs:
  changes:
    name: What changed
    # Copies made by the Deploy to Cloudflare button get this file too; they don't need it.
    if: github.repository == 'jotyy/vauly'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      site: ${{ steps.filter.outputs.site }}
      firefox: ${{ steps.filter.outputs.firefox }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # A file counts when it matches a pattern and none of those starting with "!".
          predicate-quantifier: some-with-excludes
          filters: |
            app:
              - "**"
              - "!apps/site/**"
              - "!native/**"
              - "!docs/**"
              - "!e2e/site/**"
              - "!e2e/site.config.ts"
              - "!**/*.md"
            site:
              - "apps/site/**"
              - "docs/**"
              - "packages/ui/**"
              - "packages/crypto/**"
              - "e2e/site/**"
              - "e2e/site.config.ts"
              - "e2e/package.json"
              - "package.json"
              - "bun.lock"
              - ".github/workflows/ci.yml"
            firefox:
              - "apps/extension/**"
              - "packages/crypto/**"
              - "packages/ui/**"
              - "e2e/firefox/**"
              - "e2e/firefox.config.ts"
            native:
              - "native/**"
              - "packages/crypto/test-vectors.json"
              - ".github/workflows/ci.yml"

  check:
    name: Types, lint and unit tests
    if: github.repository == 'jotyy/vauly'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Astro needs a newer Node 22 than the runner image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bunx biome ci .
      - run: bun run test

  # Two builds of one commit, in different directories, must give byte-identical files:
  # that's what lets anyone check an instance with `vauly verify` (docs/security.md).
  reproducible:
    name: Reproducible builds
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: first
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: first/package.json
      # The extension's Firefox build too: addons.mozilla.org rebuilds it from the source
      # and wants the same files.
      - name: Build twice
        run: |
          cp -R first "$RUNNER_TEMP/second-copy"
          for dir in "$GITHUB_WORKSPACE/first" "$RUNNER_TEMP/second-copy"; do
            (cd "$dir" && bun install --frozen-lockfile && bun run build && bun run --cwd apps/extension build:firefox)
          done
      - name: Compare
        run: |
          diff -r first/apps/web/dist "$RUNNER_TEMP/second-copy/apps/web/dist"
          diff -r first/apps/extension/.output/firefox-mv3 "$RUNNER_TEMP/second-copy/apps/extension/.output/firefox-mv3"
          echo "Both builds are byte-identical."
      # Production and the demo are built by `alchemy deploy`, with Alchemy's own build
      # function and the stage's settings, a separate API among them, so that build has to
      # serve the same files as the plain one, which has no server URL. Only vauly.json and
      # _headers may differ.
      - name: Build the way alchemy deploy does, with a server URL, and compare
        working-directory: ${{ runner.temp }}/second-copy/packages/infra
        env:
          VITE_SERVER_URL: https://api.example.test
        run: bun scripts/build-web.ts "$GITHUB_WORKSPACE/first/apps/web/dist/.well-known/vauly-build.json"
      - uses: actions/upload-artifact@v7
        with:
          name: vauly-build
          path: first/apps/web/dist/.well-known/vauly-build.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: first/apps/web/dist
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        with:
          name: extension-firefox
          path: first/apps/extension/.output/firefox-mv3

  # A release's manifest is built on Linux, and an instance may be built anywhere: on
  # another machine and another system, the build has to come out the same.
  reproducible-macos:
    name: Reproducible builds, on macOS
    needs: reproducible
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/web
      - run: bun run build:firefox
        working-directory: apps/extension
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: ${{ runner.temp }}/linux-dist
      - uses: actions/download-artifact@v7
        with:
          name: extension-firefox
          path: ${{ runner.temp }}/linux-firefox
      - name: Compare with the Linux build
        run: |
          diff -r "$RUNNER_TEMP/linux-dist" apps/web/dist
          diff -r "$RUNNER_TEMP/linux-firefox" apps/extension/.output/firefox-mv3
          echo "The macOS build and the Linux build are byte-identical."

  site:
    name: Website
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
        working-directory: e2e
      - run: bun run test:site

  # The suite runs one test at a time against one database, so it's split across three
  # runners, each with a stack of its own.
  e2e:
    name: End-to-end tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Throwaway values for the local test stack only.
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3100
      CORS_ORIGIN: http://localhost:3101
      VITE_SERVER_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
        working-directory: e2e
      # Now and then `alchemy dev` hangs on a fresh runner without a word. So the stack
      # starts here, gets four minutes, and gets one more try; the suite then reuses it.
      - name: Start the test stack
        working-directory: packages/infra
        env:
          VAULY_API_PORT: 3100
          VAULY_WEB_PORT: 3101
          VAULY_E2E_RESET_TOKEN: vauly-e2e-local
        run: |
          for attempt in 1 2; do
            nohup bun run dev --stage e2e > "../../e2e/stack-$attempt.log" 2>&1 &
            # Four minutes by the clock: each try gives up after five seconds, so a server
            # that takes the connection and never answers can't hold the job.
            deadline=$((SECONDS + 240))
            while [ "$SECONDS" -lt "$deadline" ]; do
              curl -sf --max-time 5 -o /dev/null http://localhost:3101/ && exit 0
              sleep 1
            done
            echo "::warning::The test stack didn't start in four minutes (try $attempt)"
            tail -n 40 "../../e2e/stack-$attempt.log"
            pkill -f "alchemy dev" || true
            pkill -f workerd || true
            sleep 3
          done
          exit 1
      - run: bun run test --shard=${{ matrix.shard }}/3
        working-directory: e2e
        env:
          VAULY_E2E_STACK: started
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/report
            e2e/results
            e2e/stack-*.log
          retention-days: 7

  one-worker:
    name: End-to-end tests, as one Worker (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
        working-directory: e2e
      # The app as the Deploy to Cloudflare button deploys it: wrangler.jsonc under
      # `wrangler dev`, with no secrets, so the Worker makes its own and migrates its D1.
      - run: bun run test:one-worker --shard=${{ matrix.shard }}/3
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-one-worker-${{ matrix.shard }}
          path: |
            e2e/report
            e2e/results
          retention-days: 7

  # The extension's Firefox build, in Firefox. Playwright can't load extensions there, so
  # Puppeteer drives it (e2e/firefox), against vauly as one Worker.
  firefox:
    name: Extension in Firefox
    needs: changes
    if: needs.changes.outputs.firefox == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
        working-directory: e2e
      # The spec downloads Firefox's current release into e2e/.cache; keep it a month.
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: e2e/.cache/firefox
          key: firefox-${{ runner.os }}-${{ steps.month.outputs.month }}
      - run: bun run test:firefox
        working-directory: e2e
        env:
          VAULY_E2E_ONE_WORKER: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-firefox
          path: |
            e2e/report
            e2e/results
          retention-days: 7

  # The iPhone app's crypto (native/VaulyKit), against the same test vectors as
  # packages/crypto. macOS runners are free for public repositories.
  native:
    name: Swift crypto core
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: swift test
        working-directory: native/VaulyKit

  # The one check branch protection asks for: it passes when every job above passed or
  # was skipped as not needed, and fails when any of them failed or was cancelled.
  passed:
    name: CI passed
    if: always()
    needs:
      [
        changes,
        check,
        reproducible,
        reproducible-macos,
        site,
        e2e,
        one-worker,
        firefox,
        native,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
